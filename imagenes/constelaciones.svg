<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 200" width="100%" height="100%" role="img" aria-labelledby="constTitle">
  <title id="constTitle">Constelaciones Australes del Valle del Elqui</title>
  <rect width="300" height="200" rx="16" fill="#17253D"/>
  
  <!-- Estrellas de fondo difusas -->
  <circle cx="35" cy="40" r="1.2" fill="#FFFFFF" opacity="0.6"/>
  <circle cx="75" cy="85" r="1" fill="#FFFFFF" opacity="0.5"/>
  <circle cx="120" cy="30" r="1.5" fill="#FFFFFF" opacity="0.7"/>
  <circle cx="260" cy="50" r="1.2" fill="#FFFFFF" opacity="0.6"/>
  <circle cx="280" cy="140" r="1" fill="#FFFFFF" opacity="0.5"/>
  <circle cx="45" cy="165" r="1.5" fill="#FFFFFF" opacity="0.7"/>
  <circle cx="160" cy="180" r="1.2" fill="#FFFFFF" opacity="0.6"/>

  <!-- Cruz del Sur -->
  <!-- Líneas de unión -->
  <line x1="200" y1="40" x2="200" y2="150" stroke="#E9B84B" stroke-width="1.2" stroke-dasharray="3,3" opacity="0.8"/>
  <line x1="165" y1="95" x2="235" y2="95" stroke="#E9B84B" stroke-width="1.2" stroke-dasharray="3,3" opacity="0.8"/>

  <!-- Estrellas principales con resplandor -->
  <!-- Gacrux (Arriba) -->
  <circle cx="200" cy="40" r="5" fill="#E9B84B" opacity="0.3"/>
  <circle cx="200" cy="40" r="2.8" fill="#FFFFFF"/>

  <!-- Acrux (Abajo) -->
  <circle cx="200" cy="150" r="6" fill="#E9B84B" opacity="0.4"/>
  <circle cx="200" cy="150" r="3.2" fill="#FFFFFF"/>

  <!-- Mimosa (Izquierda) -->
  <circle cx="165" cy="95" r="5" fill="#E9B84B" opacity="0.35"/>
  <circle cx="165" cy="95" r="2.8" fill="#FFFFFF"/>

  <!-- Imai (Derecha) -->
  <circle cx="235" cy="95" r="4.5" fill="#E9B84B" opacity="0.3"/>
  <circle cx="235" cy="95" r="2.5" fill="#FFFFFF"/>

  <!-- Ginan (La Intrometida) -->
  <circle cx="218" cy="118" r="3.5" fill="#E9B84B" opacity="0.3"/>
  <circle cx="218" cy="118" r="1.8" fill="#FFFFFF"/>

  <!-- Punteros Alfa y Beta Centauri a la izquierda -->
  <line x1="85" y1="80" x2="115" y2="125" stroke="#FFFFFF" stroke-width="1" stroke-dasharray="2,3" opacity="0.5"/>
  <!-- Hadar (Beta Centauri) -->
  <circle cx="115" cy="125" r="5.5" fill="#685178" opacity="0.5"/>
  <circle cx="115" cy="125" r="3" fill="#FFFFFF"/>
  <!-- Rigil Kentaurus (Alfa Centauri) -->
  <circle cx="85" cy="80" r="6.5" fill="#E9B84B" opacity="0.4"/>
  <circle cx="85" cy="80" r="3.5" fill="#FFFFFF"/>

  <!-- Leyenda accesible -->
  <text x="18" y="185" fill="#EFAF8C" font-family="sans-serif" font-size="10" letter-spacing="1">CRUZ DEL SUR &amp; PUNTEROS</text>
</svg>

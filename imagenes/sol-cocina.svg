<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%" role="img" aria-labelledby="solTitle">
  <title id="solTitle">Icono de Sol y Energía Solar</title>
  <defs>
    <linearGradient id="solGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E9B84B"/>
      <stop offset="50%" stop-color="#D46A38"/>
      <stop offset="100%" stop-color="#BC6949"/>
    </linearGradient>
  </defs>
  <circle cx="100" cy="100" r="42" fill="url(#solGrad)"/>
  <circle cx="100" cy="100" r="48" fill="none" stroke="#E9B84B" stroke-width="2.5" stroke-dasharray="4,6" opacity="0.8"/>
  <!-- Rayos solares geométricos -->
  <g stroke="url(#solGrad)" stroke-width="4.5" stroke-linecap="round">
    <line x1="100" y1="20" x2="100" y2="40"/>
    <line x1="100" y1="160" x2="100" y2="180"/>
    <line x1="20" y1="100" x2="40" y2="100"/>
    <line x1="160" y1="100" x2="180" y2="100"/>
    <line x1="43" y1="43" x2="57" y2="57"/>
    <line x1="143" y1="143" x2="157" y2="157"/>
    <line x1="157" y1="43" x2="143" y2="57"/>
    <line x1="57" y1="143" x2="43" y2="157"/>
    <line x1="100" y1="5" x2="100" y2="12" stroke-width="3"/>
    <line x1="100" y1="188" x2="100" y2="195" stroke-width="3"/>
    <line x1="5" y1="100" x2="12" y2="100" stroke-width="3"/>
    <line x1="188" y1="100" x2="195" y2="100" stroke-width="3"/>
  </g>
  <circle cx="100" cy="100" r="28" fill="#F7EBD5" opacity="0.35"/>
</svg>
